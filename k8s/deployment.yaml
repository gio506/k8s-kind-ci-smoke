---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiny-web
  namespace: smoke-demo
  labels:
    app: tiny-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tiny-web
  template:
    metadata:
      labels:
        app: tiny-web
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tiny-web
          image: hashicorp/http-echo:1.0.0
          args:
            - "-text=kind-ci-smoke-ok"
          ports:
            - containerPort: 5678
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 5678
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 5678
            initialDelaySeconds: 5
            periodSeconds: 5
